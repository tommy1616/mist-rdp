name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-rust:
    name: Rust Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Run cargo test
        working-directory: src-tauri
        run: cargo test --bins

  check-frontend:
    name: Frontend Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check app.js syntax
        run: node --check frontend/app.js
      - name: Check vault-ui.js syntax
        run: node --check frontend/vault-ui.js
      - name: Check app-security.js syntax
        run: node --check frontend/app-security.js
      - name: Check i18n and locale keys
        run: |
          node --check frontend/i18n.js
          node -e "global.window={};require('./frontend/locales/zh-TW.js');require('./frontend/locales/en.js');const a=Object.keys(window.I18N['zh-TW']),b=Object.keys(window.I18N.en);const m=a.filter(k=>!b.includes(k)).concat(b.filter(k=>!a.includes(k)));if(m.length){console.error('mismatched keys:',m);process.exit(1)}"
