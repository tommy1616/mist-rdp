[package]
name = "mist-rdp"
version = "0.2.20"
description = "MistRDP — Cross-platform Rust + Web RDP client powered by IronRDP & Tauri v2"
authors = ["SHXJ"]
license = "MIT"
edition = "2024"
rust-version = "1.94"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.11"
base64 = "0.22"
rand = "0.8"
argon2 = "0.5"
aes-gcm = "0.10"
zeroize = { version = "1", features = ["derive"] }
keyring = "4.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# Pure Rust IronRDP stack + OS-native TLS (Windows Schannel / macOS SecureTransport, zero OpenSSL deps)
ironrdp-core = "0.3"
ironrdp-pdu = "0.11"
ironrdp-svc = "0.10"
ironrdp-dvc = "0.10"
ironrdp-connector = "0.12"
ironrdp-session = "0.13"
ironrdp-graphics = "0.11"
ironrdp-displaycontrol = "0.10"
ironrdp-cliprdr = "0.9"
ironrdp-cliprdr-native = "0.9"
ironrdp-rdpsnd = "0.11"
ironrdp-rdpsnd-native = { version = "0.8", default-features = false }
ironrdp-rdpdr = "0.9"
ironrdp-rdpdr-native = "0.9"
ironrdp-tokio = { version = "0.12", features = ["reqwest-rustls-ring"] }
tokio-native-tls = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_Com",
  "Win32_System_DataExchange",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[patch.crates-io]
ironrdp-connector = { path = "vendor/ironrdp-connector" }
